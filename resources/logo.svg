<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="timber-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2B22"/>
      <stop offset="1" stop-color="#0E1712"/>
    </linearGradient>
    <radialGradient id="timber-core" cx="0.47" cy="0.52" r="0.62">
      <stop offset="0" stop-color="#E9C08A"/>
      <stop offset="0.55" stop-color="#D9A76A"/>
      <stop offset="1" stop-color="#B9834C"/>
    </radialGradient>
  </defs>

  <!-- 底板 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#timber-bg)"/>

  <!-- 树桩横截面：年轮 = 项目的每一次提交 -->
  <g transform="translate(256 262) scale(1 0.965)">
    <!-- 树皮 -->
    <circle r="206" fill="#4A2F1B"/>
    <circle r="206" fill="none" stroke="#5C3B22" stroke-width="6"/>
    <!-- 边材 -->
    <circle r="188" fill="#E5CEA6"/>
    <!-- 心材底色 -->
    <circle r="172" fill="url(#timber-core)"/>

    <!-- 年轮（深线/浅线交替） -->
    <g fill="none" stroke-linecap="round">
      <circle r="150" stroke="#A9713B" stroke-width="5" opacity="0.85"/>
      <circle r="138" stroke="#C98F52" stroke-width="2.6" opacity="0.8"/>
      <circle r="121" stroke="#A9713B" stroke-width="4.4" opacity="0.85"/>
      <circle r="109" stroke="#C98F52" stroke-width="2.4" opacity="0.8"/>
      <circle r="93"  stroke="#A96B37" stroke-width="4"   opacity="0.85"/>
      <circle r="81"  stroke="#C98F52" stroke-width="2.2" opacity="0.8"/>
      <circle r="66"  stroke="#A96633" stroke-width="0" opacity="0"/>
      <circle r="66"  stroke="#A96633" stroke-width="3.6" opacity="0.9"/>
      <circle r="54"  stroke="#C9894C" stroke-width="2"   opacity="0.8"/>
      <circle r="40"  stroke="#A96633" stroke-width="3.2" opacity="0.9"/>
      <circle r="29"  stroke="#C9894C" stroke-width="1.8" opacity="0.85"/>
      <circle r="17"  stroke="#A96633" stroke-width="2.8" opacity="0.95"/>
    </g>

    <!-- 髓心 -->
    <circle r="7" fill="#8A5227"/>

    <!-- 裂纹（两道，从外向内，不到髓心） -->
    <path d="M 40 -168 L 30 -108 L 36 -62" fill="none" stroke="#7C4820" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <path d="M 132 118 L 86 76 L 52 58" fill="none" stroke="#7C4820" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

    <!-- 木节 -->
    <ellipse cx="-96" cy="-88" rx="20" ry="14" fill="#9C5E2E" transform="rotate(-24 -96 -88)"/>
    <ellipse cx="-96" cy="-88" rx="11" ry="7"  fill="#7C4820" transform="rotate(-24 -96 -88)"/>
  </g>

  <!-- 顶部高光，增加体积感 -->
  <ellipse cx="256" cy="150" rx="150" ry="46" fill="#FFFFFF" opacity="0.06"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="timber-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2B22"/>
      <stop offset="1" stop-color="#0E1712"/>
    </linearGradient>
    <!-- 树干柱面体积光：横向渐变，边缘深、中间暖亮 -->
    <linearGradient id="timber-trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C4820"/>
      <stop offset="0.28" stop-color="#A9713B"/>
      <stop offset="0.52" stop-color="#D9A76A"/>
      <stop offset="0.78" stop-color="#A9713B"/>
      <stop offset="1" stop-color="#6E3E1D"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#timber-bg)"/>

  <!-- 地面阴影 -->
  <ellipse cx="256" cy="421" rx="110" ry="13" fill="#000000" opacity="0.28"/>

  <!-- 树干（ Timber = 木材：主干即项目，纹理即记录 ） -->
  <g>
    <!-- 枝茬（压在树干后方，根部被遮住）：右侧一根、左上小枝 -->
    <path d="M 300 252 L 350 230" fill="none" stroke="#A9713B" stroke-width="26" stroke-linecap="round"/>
    <path d="M 210 196 L 176 178" fill="none" stroke="#A9713B" stroke-width="19" stroke-linecap="round"/>

    <!-- 树干本体：微锥度，底部根脚外张 -->
    <path fill="url(#timber-trunk)" d="M 212 116
      C 208 190 204 280 202 358
      C 200 384 192 400 176 412
      Q 192 418 206 406
      Q 224 422 244 408
      Q 262 422 280 406
      Q 302 418 322 408
      C 312 394 310 378 310 358
      C 308 280 304 190 300 116
      Z"/>

    <!-- 树皮纹理：纵向深浅交替 -->
    <g fill="none" stroke-linecap="round">
      <path d="M 234 150 C 231 215 229 285 227 350" stroke="#7C4820" stroke-width="5.5" opacity="0.85"/>
      <path d="M 251 142 C 249 212 248 282 247 348" stroke="#E9C08A" stroke-width="3.2" opacity="0.8"/>
      <path d="M 270 150 C 272 218 274 290 276 352" stroke="#8A5227" stroke-width="4.5" opacity="0.8"/>
      <path d="M 288 178 C 291 235 293 295 295 342" stroke="#D9A76A" stroke-width="3"   opacity="0.7"/>
      <path d="M 217 235 C 214 282 212 318 211 348" stroke="#A9713B" stroke-width="4"   opacity="0.7"/>
    </g>

    <!-- 干身木节 -->
    <ellipse cx="260" cy="305" rx="13" ry="18" fill="none" stroke="#8A5227" stroke-width="2.5" opacity="0.5"/>
    <ellipse cx="260" cy="305" rx="8"  ry="12" fill="#7C4820" opacity="0.9"/>

    <!-- 枝茬锯断面 -->
    <ellipse cx="353" cy="228" rx="8"   ry="12"  fill="#E9C08A" stroke="#B9834C" stroke-width="2.5" transform="rotate(-23.7 353 228)"/>
    <ellipse cx="353" cy="228" rx="3.6" ry="6.5" fill="none" stroke="#D9A76A" stroke-width="1.8" opacity="0.8" transform="rotate(-23.7 353 228)"/>
    <ellipse cx="174" cy="176" rx="6.5" ry="9.5" fill="#E9C08A" stroke="#B9834C" stroke-width="2.2" transform="rotate(27.9 174 176)"/>

    <!-- 顶部锯断面：一圈浅环暗示年轮，不再作为主体 -->
    <ellipse cx="256" cy="116" rx="44" ry="16.5" fill="#E9C08A" stroke="#B9834C" stroke-width="3"/>
    <ellipse cx="256" cy="116" rx="26" ry="9.5"  fill="none" stroke="#D9A76A" stroke-width="2" opacity="0.75"/>
    <ellipse cx="256" cy="116" rx="5"  ry="2.2"  fill="#C9894C"/>
  </g>

</svg>
